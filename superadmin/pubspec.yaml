name: werkkern_superadmin
description: >
  Superadmin-Panel für den SaaS-Betrieb von WerkkernERP — Firmen
  auflisten, Abo pflegen, sperren/entsperren. Eigene Web-App im eigenen
  Container (deploy/strato), spricht über /api mit dem Server.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  werkkern_client:
    path: ../packages/werkkern_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Tests laufen gegen den echten Server-Router (In-Memory).
  werkkernerp_server:
    path: ../server
  http: ^1.5.0
  shelf: ^1.4.2

flutter:
  uses-material-design: true
