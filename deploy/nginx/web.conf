# nginx im Web-Container: liefert den Flutter-Web-Build aus und reicht
# /api/ an den Server-Container weiter (gleicher Origin, kein CORS).
# In der App als Server-Adresse dann z. B. https://erp.example.org/api
# eintragen.

# Echte Client-Adresse vom vorgeschalteten Reverse-Proxy übernehmen
# (Nginx Proxy Manager setzt X-Real-IP). Nur private Netze gelten als
# vertrauenswürdig — wer den Port direkt anspricht, kann sie nicht fälschen.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Real-IP;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker-DNS: nginx startet auch, wenn der Server-Container fehlt.
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location /api/ {
        set $upstream server:8090;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Genau eine Adresse: die von oben übernommene echte Client-IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Updates sofort ausliefern: Einstiegsdateien nie cachen.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
