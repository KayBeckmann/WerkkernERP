services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:8085:80"

  # ---- Phase B: Online-Multi-User-Server (B1) ------------------------
  # Eigenständiger Dienst, unabhängig vom Flutter-Client/Offline-
  # SQLite. Siehe server/README.md und das Vault-ADR-0001
  # (10_Projects/Flutter-ERP-RechnungsFee/Decisions/).
  server-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: werkkernerp_server
      POSTGRES_USER: werkkernerp_server
      POSTGRES_PASSWORD: ${SERVER_DB_PASSWORD:-werkkernerp_server}
    volumes:
      - server-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werkkernerp_server"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      server-db:
        condition: service_healthy
    environment:
      PORT: "8090"
      DB_HOST: server-db
      DB_PORT: "5432"
      DB_NAME: werkkernerp_server
      DB_USER: werkkernerp_server
      DB_PASSWORD: ${SERVER_DB_PASSWORD:-werkkernerp_server}
      # Web-Vorschau (:8085) darf den Server ansprechen; kommagetrennt,
      # z. B. "http://10.10.2.123:8085". Leer = nur native Apps.
      CORS_ALLOWED_ORIGINS: ${SERVER_CORS_ALLOWED_ORIGINS:-*}
      # Nur hinter dem eigenen TLS-Proxy (Profil "tls") auf true setzen.
      TRUST_PROXY: ${SERVER_TRUST_PROXY:-false}
    ports:
      # Entwicklung/LAN: direkt erreichbar. Produktion: SERVER_BIND=127.0.0.1
      # und nur über den TLS-Proxy veröffentlichen.
      - "${SERVER_BIND:-0.0.0.0}:8190:8090"

  # Produktion: TLS-Proxy (docker compose --profile tls up -d), siehe
  # server/README.md. SERVER_DOMAIN muss per DNS auf diesen Host zeigen.
  proxy:
    image: caddy:2-alpine
    profiles: ["tls"]
    depends_on:
      - server
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./server/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  server-db-data:
  caddy-data:
