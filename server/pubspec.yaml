name: werkkernerp_server
description: >
  WerkkernERP Online-Multi-User-Server (Phase B, B1: Mitgliedschaften,
  Gruppen, Backend-Isolation). Eigenständiger Dienst, unabhängig vom
  Flutter-Client (lib/) und dessen Offline-SQLite — siehe
  docs/phase-b-server.md und das Vault-ADR-0001.
publish_to: none
environment:
  sdk: ^3.9.0

dependencies:
  shelf: ^1.4.3
  shelf_router: ^1.1.5
  postgres: ^3.5.6
  bcrypt: ^1.2.0
  crypto: ^3.0.6
  uuid: ^4.6.0
  decimal: ^3.2.6
  # Gemeinsamer Rechenkern mit der Offline-App (Money, Summen, Nummernformat).
  werkkern_core:
    path: ../packages/werkkern_core

dev_dependencies:
  # Vertragstests: der echte App-Client gegen den echten Router.
  werkkern_client:
    path: ../packages/werkkern_client
  werkkern_mcp:
    path: ../packages/werkkern_mcp
  test: ^1.26.2
  http: ^1.5.0
